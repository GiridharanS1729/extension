<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>DevKit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" id="shell">
    <div class="resize-handle" id="resizeHandle" aria-label="Resize sidebar"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8.2 7 3 12l5.2 5M15.8 7l5.2 5-5.2 5M14 4l-4 16"/></svg>
        </div>
        <span class="brand">DevKit</span>
        <button class="icon-btn collapse-btn" id="collapseBtn" data-tooltip="Collapse navigation" aria-label="Collapse navigation">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="nav" id="nav" aria-label="DevKit tools"></nav>
      <div class="sidebar-footer">
        <button class="nav-item" data-page="settings">
          <span class="nav-icon" data-icon="settings"></span><span class="nav-label">Settings</span>
        </button>
        <div class="profile-chip">
          <span class="status-dot"></span>
          <span class="profile-copy"><b>Local workspace</b><small>Everything is private</small></span>
        </div>
      </div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div class="crumb"><span class="crumb-icon" id="crumbIcon"></span><span id="pageTitle">Dashboard</span></div>
        <button class="search-trigger" id="searchTrigger" aria-label="Open command palette">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <span>Search tools and actions…</span><kbd>⌘ K</kbd>
        </button>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" data-tooltip="Toggle theme" aria-label="Toggle theme"><span id="themeIcon"></span></button>
          <button class="icon-btn" id="closeBtn" data-tooltip="Close DevKit" aria-label="Close DevKit"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </section>
  </div>

  <div class="palette-backdrop" id="paletteBackdrop" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="paletteInput" placeholder="Search tools and actions…" autocomplete="off">
        <kbd>esc</kbd>
      </div>
      <div class="palette-results" id="paletteResults"></div>
      <div class="palette-footer"><span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span><span><kbd>↵</kbd> Open</span></div>
    </div>
  </div>
  <div class="dialog-backdrop" id="dialogBackdrop" hidden></div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <input type="file" id="fileInput" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
