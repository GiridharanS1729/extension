<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 12px;
            width: 220px;
        }

        h4 {
            margin: 0 0 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h4>Enable Inputs</h4>

    <label>
        <input type="radio" name="mode" value="checkbox" checked />
        Only Checkboxes
    </label>

    <label>
        <input type="radio" name="mode" value="all" />
        All Form Fields
    </label>

    <button id="apply">Apply</button>

    <script src="popup.js"></script>
</body>

</html>
